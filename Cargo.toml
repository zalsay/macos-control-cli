[package]
name = "copis-chrome"
version = "0.3.4"
edition = "2021"
rust-version = "1.89"
description = "独立的 macOS Chrome 桌面自动化 CLI（Rust + Swift）"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
url = "=2.5.8"
rcgen = { version = "=0.14.10", features = ["zeroize"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
ring = "=0.17.14"
subtle = "=2.6.1"
time = "=0.3.47"
libc = "=0.2.177"
x509-parser = "=0.18.1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
signal-hook = { version = "=0.4.5", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
